<!doctype html><html lang="ja" data-base-path="{{.BasePath}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン · {{.WorkspaceTitle}}</title><meta name="theme-color" content="#334155"><link rel="icon" href="{{.BasePath}}/favicon.svg" type="image/svg+xml"><link rel="icon" href="{{.BasePath}}/favicon.ico" sizes="any"><link rel="stylesheet" href="{{.BasePath}}/vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="{{.BasePath}}/css/theme.css"><link rel="stylesheet" href="{{.BasePath}}/css/app.css"></head>
<body class="login-page"><main class="login-shell"><form class="card login-card" id="loginForm" autocomplete="on"><div class="login-brand"><svg class="brand-icon" aria-hidden="true"><use href="{{.BasePath}}/vendor/bootstrap-icons/bootstrap-icons.svg#chat-square-text"></use></svg><strong>{{.WorkspaceTitle}}</strong></div><div class="card-body p-0"><h1>ワークスペースにログイン</h1><p class="login-lead">{{.LoginMessage}}</p><div class="mb-3"><label class="form-label" for="uid">ユーザーID</label><input class="form-control" id="uid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required></div><div class="mb-3"><label class="form-label" for="pw">パスワード</label><input class="form-control" id="pw" name="password" type="password" autocomplete="current-password" required></div><div class="form-check mb-3"><input class="form-check-input" id="showPassword" type="checkbox" aria-controls="pw"><label class="form-check-label" for="showPassword">パスワードを表示</label></div><div id="loginError" class="alert alert-danger hidden" role="alert"></div><button class="btn btn-success w-100" id="loginButton" type="submit">ログイン</button></div></form></main><div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true"></div><script src="{{.BasePath}}/js/urls.js"></script><script src="{{.BasePath}}/vendor/bootstrap/bootstrap.bundle.min.js"></script><script src="{{.BasePath}}/js/login.js"></script></body></html>
